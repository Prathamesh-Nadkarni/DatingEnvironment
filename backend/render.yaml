services:
  - type: web
    name: mirofish-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: ANTHROPIC_API_KEY
        sync: false # You will need to add this manually in Render dashboard
      - key: PORT
        value: 10000
